<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BlackBerry OS 7 Simulator</title>
    <style>
        /* ================= CSS 部分 ================= */
        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            overflow: hidden; /* 禁止整个网页上下滑动 */
            touch-action: none; /* 禁止浏览器默认的触摸手势 */
        }

        .blackberry-device {
            width: 100%;
            max-width: 380px; /* 手机上的最大宽度 */
            height: 95vh; /* 占据屏幕高度 */
            max-height: 750px;
            background: linear-gradient(180deg, #1a1a1a, #0a0a0a);
            border-radius: 15px;
            padding: 10px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border: 1px solid #333;
        }

        .top-bezel { text-align: center; padding-bottom: 5px; }
        .speaker { width: 60px; height: 4px; background: #333; margin: 0 auto; border-radius: 2px;}
        .logo { color: #ccc; font-size: 10px; margin-top: 5px; font-weight: bold; letter-spacing: 2px;}

        .screen {
            background: #000;
            flex-grow: 1; /* 屏幕自动撑满中间区域 */
            border: 2px solid #333;
            border-radius: 5px;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .status-bar {
            background: #111;
            color: #888;
            font-size: 12px;
            padding: 3px 10px;
            display: flex;
            justify-content: space-between;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
            align-content: start;
        }

        .app-icon {
            background: #333;
            aspect-ratio: 1 / 1; /* 保持正方形 */
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 14px;
            border: 2px solid transparent;
            cursor: pointer;
        }

        /* 选中状态 */
        .app-icon.active {
            border-color: #00bfff; 
            background: #222;
            box-shadow: 0 0 15px rgba(0, 191, 255, 0.6);
            transform: scale(1.05);
            transition: transform 0.1s;
        }

        .nav-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 10px;
        }

        .call-btn { width: 60px; height: 30px; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 12px; color: #fff;}
        .call-btn.green { background: #008000; }
        .call-btn.red { background: #cc0000; }

        /* 模拟的光学触控板 */
        .trackpad {
            width: 70px;
            height: 40px;
            background: #222;
            border-radius: 20px;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.8), 0 1px 1px rgba(255,255,255,0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        .trackpad-inner {
            width: 50px;
            height: 20px;
            background: radial-gradient(circle, #444, #111);
            border-radius: 10px;
        }

        .keyboard { padding: 5px 0 0 0; }
        .key-row { display: flex; justify-content: center; gap: 5px; margin-bottom: 5px; }
        .key-row span {
            background: #222;
            color: #666;
            width: 12%;
            height: 25px;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 14px;
            box-shadow: 0 2px 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <!-- ================= HTML 部分 ================= -->
    <div class="blackberry-device">
        <div class="top-bezel">
            <div class="speaker"></div>
            <div class="logo">BlackBerry</div>
        </div>

        <!-- 屏幕区域 -->
        <div class="screen" id="screen-area">
            <div class="status-bar">中国移动 3G <span class="time">12:00</span></div>
            <div class="app-grid" id="app-grid"></div>
        </div>

        <!-- 底部微操区域 -->
        <div class="nav-row">
            <div class="call-btn green" id="btn-call">接听</div>
            <!-- 这个圆圈就是你的虚拟光学触控板 -->
            <div class="trackpad" id="trackpad">
                <div class="trackpad-inner"></div>
            </div>
            <div class="call-btn red" id="btn-end">挂断</div>
        </div>

        <!-- 经典全键盘 -->
        <div class="keyboard">
            <div class="key-row"><span>Q</span><span>W</span><span>E</span><span>R</span><span>T</span><span>Y</span></div>
            <div class="key-row"><span>A</span><span>S</span><span>D</span><span>F</span><span>G</span><span>H</span></div>
            <div class="key-row"><span>Z</span><span>X</span><span>C</span><span>V</span><span>B</span><span>N</span></div>
        </div>
    </div>

    <!-- ================= JavaScript 部分 ================= -->
    <script>
        const apps = [
            { name: "短信", id: "messages" },
            { name: "邮件", id: "email" },
            { name: "BBM", id: "bbm" },
            { name: "浏览器", id: "browser" },
            { name: "音乐", id: "media" },
            { name: "设置", id: "settings" }
        ];

        let currentIndex = 0;
        const grid = document.getElementById('app-grid');
        const trackpad = document.getElementById('trackpad');
        const screenArea = document.getElementById('screen-area');

        // 1. 渲染图标
        apps.forEach((app, index) => {
            const div = document.createElement('div');
            div.className = 'app-icon';
            if (index === 0) div.classList.add('active');
            div.innerText = app.name;
            div.id = app.id;
            // 允许直接点击图标打开
            div.addEventListener('click', () => openApp(app.id));
            grid.appendChild(div);
        });

        const icons = document.querySelectorAll('.app-icon');

        // 2. 更新焦点高亮
        function updateFocus(newIndex) {
            icons[currentIndex].classList.remove('active');
            currentIndex = newIndex;
            if (currentIndex < 0) currentIndex = icons.length - 1;
            if (currentIndex >= icons.length) currentIndex = 0;
            icons[currentIndex].classList.add('active');
        }

        // ========== 3. 移动端手势逻辑（核心） ==========
        let startX = 0, startY = 0;
        let isSwiping = false;

        // 给触控板绑定触摸事件
        trackpad.addEventListener('touchstart', handleTouchStart, {passive: false});
        trackpad.addEventListener('touchmove', handleTouchMove, {passive: false});
        trackpad.addEventListener('touchend', handleTouchEnd, {passive: false});

        // 兼容电脑端鼠标操作触控板
        trackpad.addEventListener('click', () => {
            openApp(apps[currentIndex].id);
        });

        function handleTouchStart(e) {
            e.preventDefault(); // 阻止屏幕滚动
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            isSwiping = false;
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (startX === 0 || startY === 0) return;

            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;
            let deltaX = currentX - startX;
            let deltaY = currentY - startY;
            
            // 灵敏度阈值（滑动超过20像素触发）
            const threshold = 20;

            if (Math.abs(deltaX) > threshold || Math.abs(deltaY) > threshold) {
                isSwiping = true; // 标记这是一次滑动
                let cols = 3;
                
                if (Math.abs(deltaX) > Math.abs(deltaY)) {
                    // 左右滑动
                    if (deltaX > 0) updateFocus(currentIndex + 1);
                    else updateFocus(currentIndex - 1);
                } else {
                    // 上下滑动
                    if (deltaY > 0) updateFocus(currentIndex + cols);
                    else updateFocus(currentIndex - cols);
                }
                
                // 重置起点，为了支持长距离连续滑动
                startX = currentX;
                startY = currentY;
            }
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            // 如果手指抬起，且没有发生滑动，说明是“按压”触控板
            if (!isSwiping) {
                openApp(apps[currentIndex].id);
            }
            startX = 0;
            startY = 0;
        }

        // ========== 4. 补充：允许在大屏幕上直接用手指滑动 ==========
        let screenStartX = 0;
        screenArea.addEventListener('touchstart', (e) => { screenStartX = e.touches[0].clientX; }, {passive: true});
        screenArea.addEventListener('touchend', (e) => {
            let delta = e.changedTouches[0].clientX - screenStartX;
            // 在大屏幕上左右滑也可以切换焦点
            if (delta > 30) updateFocus(currentIndex - 1);
            else if (delta < -30) updateFocus(currentIndex + 1);
        }, {passive: true});

        // ========== 5. 键盘监听 (适配电脑端) ==========
        document.addEventListener('keydown', (e) => {
            let cols = 3;
            if (e.key === 'ArrowRight') updateFocus(currentIndex + 1);
            else if (e.key === 'ArrowLeft') updateFocus(currentIndex - 1);
            else if (e.key === 'ArrowDown') updateFocus(currentIndex + cols);
            else if (e.key === 'ArrowUp') updateFocus(currentIndex - cols);
            else if (e.key === 'Enter') openApp(apps[currentIndex].id);
        });

        // ========== 6. 打开应用的逻辑 ==========
        function openApp(appId) {
            const screen = document.querySelector('.screen');
            if (appId === 'messages') {
                // 还原经典短信界面
                screen.innerHTML = `
                    <div class="status-bar" style="justify-content: flex-start; gap: 15px;">
                        <span onclick="location.reload()" style="cursor:pointer;color:#00bfff;font-weight:bold;">&lt; 返回</span>
                        <span>短信</span>
                    </div>
                    <div style="color:white; padding: 15px; font-size: 14px; overflow-y: auto;">
                        <div style="margin-bottom:15px; border-bottom:1px solid #333; padding-bottom:10px;">
                            <b>老妈</b><br>
                            <span style="color:#888;">晚饭回家吃吗？</span>
                        </div>
                        <div style="margin-bottom:15px; border-bottom:1px solid #333; padding-bottom:10px;">
                            <b>10086</b><br>
                            <span style="color:#888;">您本月流量已使用80%。</span>
                        </div>
                        <div style="margin-bottom:15px; border-bottom:1px solid #333; padding-bottom:10px;">
                            <b>BBM好友</b><br>
                            <span style="color:#888;">PIN: 2A3B4C5D</span>
                        </div>
                    </div>
                `;
            } else {
                alert("【" + appId + "】 正在开发中...\n你可以通过修改代码自己还原它！");
            }
        }
    </script>
</body>
</html>
